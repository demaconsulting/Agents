---
# Spell-Checking with TextLint
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - NEVER add a misspelled word - fix the typo in the source instead
# - NEVER add a British-English spelling - correct to US-English in the source
# - PROPOSE only genuine technical terms/names as needed
version: '0.2'
language: en

# Matches cspell, which also checks hidden paths such as .github/ and .*.yaml
enableGlobDot: true

# The files lint.ps1 spell-checks
files:
  - "**/*.{md,yaml,yml,json,cs,cpp,hpp,h,txt}"
words:
  - buildmark
  - canvasnet
  - demaconsulting
  - dictionarymark
  - fileshare
  - pandoctool
  - SonarQube
  - thirdparty
  - venv
  - WeasyPrintTool
  - weasyprinttool
  - Dema
  - fileassert
  - Pandoc
  - postconditions
  - reqstream
  - reviewmark
  - sarif
  - sarifmark
  - slnx
  - sonar
  - sonarmark
  - sysml
  - textlint
  - versionmark
  - Weasyprint
  - xunit
  - Xunit
  - yamlfix
ignorePaths:
  - '**/.git/**'
  - '**/node_modules/**'
  - '**/.venv/**'
  - '**/thirdparty/**'
  - '**/third-party/**'
  - '**/3rd-party/**'
  - '**/.agent-logs/**'
  - '**/bin/**'
  - '**/obj/**'
  - '**/generated/**'
  - package-lock.json
